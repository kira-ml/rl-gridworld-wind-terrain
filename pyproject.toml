[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "rl_gridworld_wind_terrain"
version = "0.1.0"
description = "A reinforcement learning environment with wind and terrain effects"
readme = "README.md"
requires-python = ">=3.8"
license = {file = "LICENSE"}
authors = [
    {name = "Your Name", email = "your.email@example.com"},
]

dependencies = [
    "numpy==1.21.5",
    "torch==2.0.1",
    "pygame==2.5.0",
    "matplotlib==3.7.1",
    "pydantic==2.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.0",
    "pytest-cov==4.1.0",
    "black==23.7.0",
    "isort==5.12.0",
    "flake8==6.1.0",
    "mypy==1.4.1",
]

docs = [
    "sphinx==7.1.1",
    "sphinx-rtd-theme==1.2.2",
    "sphinx-autodoc-typehints==1.24.0",
]

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.black]
line-length = 88
target-version = ["py38"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
multi_line_output = 3
